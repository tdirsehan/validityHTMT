---
name: discriminantValidity
title: Discriminant Validity (HTMT+)
menuGroup: Factor
menuSubgroup: Validity
menuTitle: Discriminant Validity (HTMT+)
jas: '1.2'
version: '1.0.0'

options:
  - name: data
    type: Data

  - name: constructs
    title: Constructs
    type: Array
    default:
      - label: Construct 1
        vars: []
      - label: Construct 2
        vars: []
    template:
      type: Group
      elements:
        - name: label
          type: String
        - name: vars
          type: Variables
          suggested: [continuous, ordinal]
          permitted: [numeric]

  - name: correlation
    title: Correlation
    type: List
    options:
      - title: Pearson
        name: pearson
      - title: Spearman
        name: spearman
    default: pearson

  - name: missing
    title: Missing-data handling
    type: List
    options:
      - title: Pairwise complete observations
        name: pairwise
      - title: Complete cases
        name: complete
    default: pairwise

  - name: threshold
    title: HTMT+ threshold
    type: List
    options:
      - title: '0.85 (strict)'
        name: strict85
      - title: '0.90 (liberal)'
        name: liberal90
    default: liberal90

  - name: showPairs
    title: Pairwise interpretation table
    type: Bool
    default: true
...
