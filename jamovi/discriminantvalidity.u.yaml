---
name: discriminantValidity
title: Discriminant Validity (HTMT)
jus: '2.0'
compilerMode: tame
children:
  - type: VariableSupplier
    name: variablesupplier
    persistentItems: false
    suggested: [continuous, ordinal]
    permitted: [numeric]
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Constructs
        children:
          - type: ListBox
            name: constructs
            height: large
            addButton: '+ Construct'
            selectable: true
            templateName: htmt-construct-template
            template:
              type: LayoutBox
              margin: normal
              targetArea: true
              children:
                - type: VariablesListBox
                  name: blockList
                  isTarget: true
                  valueFilter: unique
                  height: auto
                  ghostText: Drag indicators here

  - type: CollapseBox
    label: Options
    collapsed: false
    children:
      - type: ComboBox
        name: correlation
      - type: ComboBox
        name: missing
      - type: ComboBox
        name: threshold
      - type: CheckBox
        name: showPairs
...
