---
name: discriminantValidity
title: Discriminant Validity (HTMT+)
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    name: variablesupplier
    persistentItems: true
    suggested: [continuous, ordinal]
    permitted: [numeric]
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Constructs
        children:
          - type: ListBox
            name: constructs
            height: large
            addButton: Add New Construct
            events:
              listItemAdded: './discriminantvalidity.events::onConstructAdded'
            template:
              type: LayoutBox
              margin: normal
              children:
                - type: TextBox
                  valueKey: [label]
                  borderless: true
                  name: blockName
                  stretchFactor: 1
                  margin: normal
                - type: VariablesListBox
                  valueFilter: unique
                  valueKey: [vars]
                  name: blockList
                  isTarget: true
                  height: auto
                  ghostText: Drag indicators here

  - type: CollapseBox
    label: Options
    collapsed: false
    children:
      - type: ComboBox
        name: correlation
      - type: ComboBox
        name: missing
      - type: ComboBox
        name: threshold
      - type: CheckBox
        name: showPairs
...
