    title: Instructions
    type: Html

  - name: htmtMatrix
    title: HTMT+ Matrix
    type: Table
    clearWith:
      - constructs
      - correlation
      - missing
    columns:
      - name: construct
        title: Construct
        type: text

  - name: pairTable
    title: Pairwise HTMT+ Assessment
    type: Table
    visible: (showPairs)
    columns:
      - name: constructA
        title: Construct A
        type: text
      - name: constructB
        title: Construct B
        type: text
      - name: htmt
        title: HTMT+
        type: number
        format: zto
      - name: threshold
        title: Threshold
        type: number
        format: zto
      - name: assessment
        title: Assessment
        type: text
...
