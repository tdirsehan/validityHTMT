name: R core and jamovi schema tests

on:
  push:
    branches:
      - review-ready-v0.2.1
      - main
      - fix/jamovi-audit-v1
  pull_request:

permissions:
  contents: read

concurrency:
  group: validityhtmt-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numerical-core:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install jamovi core dependency
        shell: Rscript {0}
        run: |
          install.packages(
            "jmvcore",
            repos = c(
              "https://repo.jamovi.org",
              "https://cloud.r-project.org"
            )
          )

      - name: Run independent HTMT+ verification
        run: Rscript tests/ci-core.R

  jamovi-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependency for jmvtools
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev

      - name: Install jmvtools
        shell: Rscript {0}
        run: |
          options(timeout = 600)
          install.packages(
            "jmvtools",
            repos = c(
              "https://repo.jamovi.org",
              "https://cloud.r-project.org"
            )
          )

      - name: Validate YAML structure and option wiring
        shell: Rscript {0}
        run: |
          install.packages("yaml", repos = "https://cloud.r-project.org")
          source("tests/audit-schema.R")

      - name: Parse all R source code
        shell: Rscript {0}
        run: |
          paths <- c(list.files("R", pattern = "\\.R$", full.names = TRUE),
                     list.files("tests", pattern = "\\.R$", full.names = TRUE))
          invisible(lapply(paths, parse))
          cat("R syntax parse completed for ", length(paths), " files.\\n")

      - name: Try jamovi compilation (requires running jamovi service)
        shell: Rscript {0}
        run: |
          result <- capture.output(jmvtools::prepare(), type = "output")
          cat(paste(result, collapse = "\\n"), "\\n")
          if (any(grepl("jamovi did not respond", result, ignore.case = TRUE))) {
            stop("jamovi compiler is unavailable: jamovi did not respond")
          }
          if (!file.exists("R/discriminantvalidity.h.R") &&
              !file.exists("R/discriminantvalidity.src.R")) {
            stop("No expected jamovi-generated code was found; verify the compiler installation.")
          }
