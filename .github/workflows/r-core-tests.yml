name: R core tests

on:
  push:
    branches:
      - review-ready-v0.2.1
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: r-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install jamovi core dependency
        shell: Rscript {0}
        run: |
          install.packages(
            "jmvcore",
            repos = c(
              "https://repo.jamovi.org",
              "https://cloud.r-project.org"
            )
          )

      - name: Run independent HTMT+ verification
        run: Rscript tests/ci-core.R
