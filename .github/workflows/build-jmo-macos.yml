name: Build jamovi JMO (macOS)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jmo-macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install jamovi application
        run: |
          brew install --cask jamovi
          test -d /Applications/jamovi.app

      - name: Install R tooling
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install module tools
        shell: Rscript {0}
        run: |
          options(timeout = 600)
          install.packages(c("jmvtools", "testthat"),
            repos = c("https://repo.jamovi.org", "https://cloud.r-project.org"))

      - name: Run numerical regression suite
        run: |
          Rscript tests/ci-core.R

      - name: Start jamovi
        timeout-minutes: 3
        run: |
          nohup open -a jamovi > /tmp/validityhtmt-jamovi-open.log 2>&1 < /dev/null &
          sleep 15
          pgrep -fl 'jamovi' || true

      - name: Build and install JMO
        shell: Rscript {0}
        run: |
          # jmvtools expects the .app bundle root, not Contents.
          options(jamovi_home = "/Applications/jamovi.app")
          status <- jmvtools::check()
          if (!identical(as.integer(status), 0L))
              stop("jmvtools::check() could not locate jamovi")
          status <- jmvtools::prepare()
          if (!identical(as.integer(status), 0L))
              stop("jmvtools::prepare() failed")
          status <- jmvtools::install()
          if (!identical(as.integer(status), 0L))
              stop("jmvtools::install() failed")

      - name: Test generated jamovi R analysis and result tables
        run: |
          R CMD INSTALL .
          Rscript tests/integration-jamovi.R

      - name: Verify actual JMO archive
        run: |
          set -euo pipefail
          find . -maxdepth 2 -type f -name '*.jmo' -print
          count=$(find . -maxdepth 2 -type f -name '*.jmo' | wc -l | tr -d ' ')
          test "$count" -ge 1
          mkdir -p dist
          find . -maxdepth 2 -type f -name '*.jmo' -exec cp {} dist/ \;
          ls -lh dist/*.jmo

      - name: Upload platform-specific JMO
        uses: actions/upload-artifact@v4
        with:
          name: validityHTMT-1.0.3-macos-jmo
          path: dist/*.jmo
          if-no-files-found: error

  publish-github-release:
    # Only publish after the complete packaged jamovi test job succeeds on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: jmo-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download tested macOS JMO
        uses: actions/download-artifact@v4
        with:
          name: validityHTMT-1.0.3-macos-jmo
          path: dist

      - name: Publish GitHub release for 1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -qx 'Version: 1.0.3' DESCRIPTION
          test -f dist/validityHTMT_1.0.3.jmo
          if gh release view v1.0.3 >/dev/null 2>&1; then
            echo 'v1.0.3 release already exists; leaving it unchanged.'
          else
            gh release create v1.0.3 dist/validityHTMT_1.0.3.jmo --target "$GITHUB_SHA" --title 'validityHTMT v1.0.3' --notes 'Release 1.0.3 addresses all three remaining display-audit findings: lower-triangular HTMT+ matrix, consolidated table notes, and pairwise-table clearWith behavior. The attached .jmo is a macOS build validated with jmvtools and automated integration tests; jamovi Library distribution is managed separately by the jamovi team.'
          fi
